<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>プロホーム</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

  <section class="hero">
    <p class="section-label">PRO DASHBOARD</p>
    <h2>プロ向け管理画面</h2>
    <p>
      レッスン作成、提出動画の確認、プロフィール管理を行います。
    </p>
  </section>

  <section class="cards">

    <div class="card">
      <a href="/profile">
        <h3>プロフィール</h3>
        <p>プロフィール画像、自己紹介、得意クラブ、SNSを編集します。</p>
      </a>
    </div>

    <div class="card">
      <a href="/lessons/new">
        <h3>レッスン作成</h3>
        <p>新しい動画添削レッスンを登録します。</p>
      </a>
    </div>

    <div class="card">
      <a th:href="@{/pro/lessons}">
        <h3>レッスン管理</h3>

        <p>
          自分が作成したレッスンを確認・編集・削除を行います。
        </p>

        <p class="section-label">
          作成レッスン
          <strong th:text="${lessonCount}">0</strong>件
        </p>
      </a>
    </div>

    <div class="card">
      <a href="/submissions">
        <h3>提出一覧</h3>
        <p>受講者から提出された動画を確認し、添削状況を管理します。</p>
      </a>
    </div>

  </section>

</main>

</body>
</html>
