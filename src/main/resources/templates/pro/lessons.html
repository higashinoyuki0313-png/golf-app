<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>レッスン管理</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

  <section class="hero">
    <p class="section-label">LESSON MANAGEMENT</p>

    <h2>レッスン管理</h2>

    <p>
      作成したレッスンの確認・編集・削除ができます。
    </p>

    <a th:href="@{/lessons/new}"
       class="btn btn-primary">
      ＋ 新しいレッスンを作成
    </a>
  </section>

  <section class="cards pro-lesson-cards">

    <div class="card"
         th:each="lesson : ${lessons}">

      <img th:if="${lesson.image != null and lesson.image != ''}"
           th:src="${lesson.image}"
           alt="レッスン画像"
           class="lesson-image">

      <video th:if="${lesson.video != null and lesson.video != ''}"
             controls
             class="lesson-video">
        <source th:src="${lesson.video}">
        動画を再生できません。
      </video>

      <p class="section-label"
         th:text="${lesson.category}">
        カテゴリ
      </p>

      <h3 th:text="${lesson.title}">
        レッスンタイトル
      </h3>

      <p th:text="${lesson.content}">
        レッスン内容
      </p>

      <div class="lesson-actions">

        <a th:href="@{/lessons/{id}(id=${lesson.id})}"
           class="btn btn-secondary">
          詳細を見る
        </a>

        <a th:href="@{/lessons/{id}/edit(id=${lesson.id})}"
           class="btn btn-primary">
          編集する
        </a>

        <form th:action="@{/lessons/{id}/delete(id=${lesson.id})}"
              method="post"
              onsubmit="return confirm('このレッスンを削除しますか？');">

          <button type="submit"
                  class="btn btn-danger">
            削除する
          </button>

        </form>

      </div>

    </div>

    <div class="empty-message"
         th:if="${#lists.isEmpty(lessons)}">

      <h2>まだレッスンがありません</h2>

      <p>
        最初のレッスンを作成してみましょう。
      </p>

      <a th:href="@{/lessons/new}"
         class="btn btn-primary">
        最初のレッスンを作成する
      </a>

    </div>

  </section>

</main>

</body>
</html>
