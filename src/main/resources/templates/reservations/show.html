<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>申込詳細</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

  <section class="hero">
    <p class="section-label">RESERVATION</p>
    <h2>申込詳細</h2>
  </section>

  <div class="card">

    <table class="table">
      <tr>
        <th>レッスン名</th>
        <td th:text="${reservation.lessonTitle}"></td>
      </tr>

      <tr>
        <th>申込者</th>
        <td th:text="${reservation.userName}"></td>
      </tr>

      <tr>
        <th>申込状況</th>
        <td>
          <span th:if="${reservation.status == 1}">申込済み</span>
          <span th:if="${reservation.status == 2}">承認済み</span>
          <span th:if="${reservation.status == 3}">キャンセル</span>
        </td>
      </tr>
    </table>

  </div>

  <div style="margin-top:30px;">
    <a href="/my-lessons" class="btn btn-secondary">
      ← マイレッスンへ戻る
    </a>
  </div>

</main>

</body>
</html>
