<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>マイレッスン</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main>

  <section class="hero">
    <p class="section-label">MY LESSONS</p>
    <h2>マイレッスン</h2>
    <p>申し込んだレッスンと動画提出状況を確認できます。</p>
  </section>

  <div class="card">

    <div th:if="${#lists.isEmpty(reservations)}">
      <p>申し込んだレッスンはまだありません。</p>
    </div>

    <table class="table" th:if="${!#lists.isEmpty(reservations)}">
      <tr>
        <th>レッスン名</th>
        <th>担当プロ</th>
        <th>申込状況</th>
        <th>提出状況</th>
        <th>操作</th>
      </tr>

      <tr th:each="reservation : ${reservations}">
        <td th:text="${reservation.lessonTitle}"></td>
        <td th:text="${reservation.proName}"></td>

        <td>
                    <span th:if="${reservation.status == 1}">
                        申込済み
                    </span>

          <span th:if="${reservation.status == 2}">
                        承認済み
                    </span>

          <span th:if="${reservation.status == 3}">
                        キャンセル
                    </span>
        </td>

        <td>
                    <span th:if="${reservation.submissionCount == 0}">
                        未提出
                    </span>

          <span th:if="${reservation.submissionCount > 0
                                  and reservation.completedSubmissionCount == 0}">
                        添削待ち
                    </span>

          <span th:if="${reservation.completedSubmissionCount > 0}">
                        添削済み
                    </span>

          <span th:if="${reservation.submissionCount > 0}">
                        （提出
                        <span th:text="${reservation.submissionCount}"></span>
                        件）
                    </span>
        </td>

        <td>
          <a th:href="@{/submissions/new/{reservationId}(reservationId=${reservation.id})}"
             class="btn btn-primary">
            動画を提出する
          </a>

          <a th:if="${reservation.submissionCount > 0}"
             href="/submissions"
             class="btn btn-secondary">
            提出内容を見る
          </a>
        </td>
      </tr>
    </table>

  </div>

  <div style="margin-top:30px;">
    <a href="/user/home" class="btn btn-secondary">
      ← ホームへ戻る
    </a>
  </div>

</main>

</body>
</html>
