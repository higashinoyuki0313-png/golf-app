<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>マイレッスン</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="page-heading my-lessons-heading">
        <p class="page-label">MY LESSONS</p>
        <h1>マイレッスン</h1>
        <p>申し込んだレッスンと動画の提出状況を確認できます。</p>
    </section>

    <section class="card my-lessons-card">

        <div class="empty-message"
             th:if="${#lists.isEmpty(reservations)}">

            <h2>申し込んだレッスンはありません</h2>

            <p>
                レッスン一覧から、受講したいレッスンを探してみましょう。
            </p>

            <a th:href="@{/lessons}"
               class="btn btn-primary">
                レッスンを探す
            </a>

        </div>

        <div th:if="${!#lists.isEmpty(reservations)}">

            <div class="card reservation-card"
                 th:each="reservation : ${reservations}">

                <div class="reservation-header">

                    <div>
                        <h2 th:text="${reservation.lessonTitle}">
                            レッスン名
                        </h2>

                        <p class="reservation-pro">
                            担当プロ：
                            <span th:text="${reservation.proName}">
                                プロ名
                            </span>
                        </p>
                    </div>

                    <div class="reservation-status">

                        <span th:if="${reservation.submissionCount == 0}"
                              class="status-badge status-not-submitted">
                            未提出
                        </span>

                        <span th:if="${reservation.submissionCount > 0
                                      and reservation.completedSubmissionCount == 0}"
                              class="status-badge status-waiting">
                            添削待ち
                        </span>

                        <span th:if="${reservation.completedSubmissionCount > 0}"
                              class="status-badge status-completed">
                            添削済み
                        </span>

                    </div>

                </div>

                <div class="reservation-info">

                    <span>
                        提出
                        <strong th:text="${reservation.submissionCount}">
                            0
                        </strong>回
                    </span>

                    <span>
                        添削完了
                        <strong th:text="${reservation.completedSubmissionCount}">
                            0
                        </strong>回
                    </span>

                    <span th:if="${reservation.submissionCount > 0}">
                        添削待ち
                        <strong th:text="${reservation.submissionCount
                                          - reservation.completedSubmissionCount}">
                            0
                        </strong>回
                    </span>

                </div>

                <div class="reservation-actions">

                    <a th:if="${reservation.submissionCount == 0}"
                       th:href="@{/submissions/new/{reservationId}
                       (reservationId=${reservation.id})}"
                       class="btn btn-primary">
                        動画を提出する
                    </a>

                    <a th:if="${reservation.submissionCount > 0}"
                       th:href="@{/submissions/new/{reservationId}
                       (reservationId=${reservation.id})}"
                       class="btn btn-primary">
                        再提出する
                    </a>

                </div>

                <details class="submission-details"
                         th:if="${reservation.submissionCount > 0}">

                    <summary class="submission-summary">

                        <span class="summary-closed">
                            ▼ 提出一覧を見る
                        </span>

                        <span class="summary-open">
                            ▲ 提出一覧を閉じる
                        </span>

                        <span>
                            （<span th:text="${reservation.submissionCount}">
                                0
                            </span>件）
                        </span>

                    </summary>

                    <div class="submission-list">

                        <div class="submission-card"
                             th:each="submission : ${reservation.submissions}">

                            <div class="submission-card-header">

                                <span th:if="${submission.status == 1}"
                                      class="status-badge status-waiting">
                                    添削待ち
                                </span>

                                <span th:if="${submission.status == 3}"
                                      class="status-badge status-completed">
                                    添削完了
                                </span>

                            </div>

                            <p class="submission-comment"
                               th:text="${submission.comment}">
                                コメント
                            </p>

                            <div class="lesson-actions">

                                <a th:href="@{/submissions/{id}
                                   (id=${submission.id})}"
                                   class="btn btn-secondary">
                                    詳細を見る
                                </a>

                                <form th:if="${submission.status == 1}"
                                      th:action="@{/submissions/{id}/delete
                                      (id=${submission.id})}"
                                      method="post"
                                      onsubmit="return confirm('この動画を削除しますか？');">

                                    <button type="submit"
                                            class="btn btn-danger">
                                        削除
                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </details>

            </div>

        </div>

    </section>

    <div class="page-actions">

        <a th:href="@{/user/home}"
           class="btn btn-secondary">
            ← ホームへ戻る
        </a>

    </div>

</main>

</body>
</html>
