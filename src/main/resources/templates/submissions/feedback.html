<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添削返信</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main>

    <section class="hero">
        <p class="section-label">FEEDBACK</p>
        <h2>添削返信</h2>
        <p th:text="${submission.lessonTitle}">レッスン名</p>
    </section>

    <div class="card">

        <p>
            <strong>提出者：</strong>
            <span th:text="${submission.userName}"></span>
        </p>

        <p>
            <strong>コメント：</strong>
            <span th:text="${submission.comment}"></span>
        </p>

        <p>
            <strong>動画URL：</strong>
            <a th:href="${submission.videoUrl}"
               th:text="${submission.videoUrl}"
               target="_blank"></a>
        </p>

        <form
                th:action="@{/submissions/{id}/feedback(id=${submission.id})}"
                method="post">

            <p>
                添削動画URL
                <input
                        type="text"
                        name="feedbackVideoUrl"
                        th:value="${submission.feedbackVideoUrl}">
            </p>

            <p>
                添削コメント
                <textarea
                        name="feedback"
                        required
                        th:text="${submission.feedback}">
                </textarea>
            </p>

            <button type="submit" class="btn btn-primary">
                添削を送信
            </button>

        </form>

        <p style="margin-top:16px;">
            <a href="/submissions" class="btn btn-secondary">
                戻る
            </a>
        </p>

    </div>

</main>

</body>
</html>
