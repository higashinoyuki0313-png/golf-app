<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>提出詳細</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <div class="card submission-detail-card">

        <h1 th:text="${submission.lessonTitle}">
            レッスン名
        </h1>

        <div class="submission-detail-section">
            <h3>提出コメント</h3>

            <p class="submission-detail-comment"
               th:text="${submission.comment}">
                提出コメント
            </p>
        </div>

        <div class="submission-detail-section"
             th:if="${submission.videoUrl != null and submission.videoUrl != ''}">

            <h3>提出動画</h3>

            <div class="submission-detail-video">
                <video controls>
                    <source th:src="${submission.videoUrl}">
                    お使いのブラウザは動画再生に対応していません。
                </video>
            </div>

        </div>

        <div class="submission-detail-section"
             th:if="${submission.feedbackVideoUrl != null and submission.feedbackVideoUrl != ''}">

            <h3>添削動画</h3>

            <div class="submission-detail-video">
                <video controls>
                    <source th:src="${submission.feedbackVideoUrl}">
                    お使いのブラウザは動画再生に対応していません。
                </video>
            </div>

        </div>

        <div class="submission-detail-section"
             th:if="${submission.feedback != null and submission.feedback != ''}">

            <h3>添削コメント</h3>

            <p class="submission-detail-comment"
               th:text="${submission.feedback}">
                添削コメント
            </p>
        </div>

        <div class="submission-detail-section">
            <h3>ステータス</h3>

            <span th:if="${submission.status == 1}"
                  class="status-badge status-waiting">
            提出中
        </span>

            <span th:if="${submission.status == 3}"
                  class="status-badge status-completed">
            添削済み
        </span>
        </div>

        <div class="submission-detail-actions">

            <a th:if="${loginAccount != null and loginAccount.role == 2}"
               th:href="@{/submissions/{id}/feedback(id=${submission.id})}"
               class="btn btn-primary">
                編集する
            </a>

            <a th:if="${loginAccount != null and loginAccount.role == 1}"
               th:href="@{/my-lessons}"
               class="btn btn-secondary">
                マイレッスンへ戻る
            </a>

            <a th:if="${loginAccount != null and loginAccount.role == 2}"
               th:href="@{/submissions}"
               class="btn btn-secondary">
                提出一覧へ戻る
            </a>

        </div>

    </div>

</main>

</body>
</html>
