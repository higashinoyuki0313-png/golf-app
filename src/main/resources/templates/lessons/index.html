<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>レッスン一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="container">

    <h1 class="page-title">
        レッスン一覧
    </h1>

    <p class="page-description">
        受講したいレッスンを選んでください
    </p>

    <div class="post-list">

        <div th:if="${#lists.isEmpty(lessons)}">
            <p>このカテゴリには、まだレッスンがありません。</p>
        </div>

        <div class="post-card" th:each="lesson : ${lessons}">

            <div class="post-tag">
                レッスン
            </div>

            <h2 class="post-title"
                th:text="${lesson.title}">
            </h2>

            <p class="lesson-pro">
                担当プロ
                <span th:text="${lesson.proName}">プロ名</span>
            </p>

            <p class="post-content"
               th:text="${lesson.content}">
            </p>

            <a class="detail-link"
               th:href="@{/lessons/{id}(id=${lesson.id})}">
                詳細を見る →
            </a>

        </div>

    </div>

    <div class="page-actions">

        <a th:if="${loginAccount != null and loginAccount.role == 2}"
           th:href="@{/pro/home}"
           class="new-post-btn">
            ← プロホームへ戻る
        </a>

        <a th:if="${loginAccount != null and loginAccount.role == 1}"
           th:href="@{/user/home}"
           class="new-post-btn">
            ← ホームへ戻る
        </a>

        <a th:if="${loginAccount == null}"
           th:href="@{/login}"
           class="new-post-btn">
            ← ログインへ戻る
        </a>

    </div>

</div>

</body>
</html>
