<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>レッスン作成</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main>

  <section class="hero">
    <p class="section-label">CREATE LESSON</p>
    <h2>レッスン作成</h2>
    <p>
      受講者へ提供する動画添削レッスンを作成します。
    </p>
  </section>

  <div class="card auth-card">

    <form action="/lessons" method="post">

      <div>
        <label>カテゴリ</label><br>
        <select name="category" required>
          <option value="slice">スライス改善</option>
          <option value="hook">フック改善</option>
          <option value="distance">飛距離アップ</option>
          <option value="contact">ミート率アップ</option>
          <option value="shortgame">ショートゲーム</option>
        </select>
      </div>

      <div>
        <label>レッスンタイトル</label><br>
        <input type="text"
               name="title"
               placeholder="例：ドライバーのスライス改善レッスン"
               required>
      </div>

      <div>
        <label>画像URL</label><br>
        <input type="text"
               name="image"
               placeholder="例：https://example.com/image.jpg">
      </div>

      <div>
        <label>レッスン内容</label><br>
        <textarea name="content"
                  rows="5"
                  placeholder="レッスンの概要や受講内容を入力してください。"
                  required></textarea>
      </div>

      <div>
        <label>原因</label><br>
        <textarea name="cause"
                  rows="4"
                  placeholder="改善したい原因を入力してください。"></textarea>
      </div>

      <div>
        <label>改善ポイント</label><br>
        <textarea name="improvement"
                  rows="4"
                  placeholder="重点的に改善するポイントを入力してください。"></textarea>
      </div>

      <div>
        <label>おすすめ練習方法</label><br>
        <textarea name="practice"
                  rows="4"
                  placeholder="受講者に行ってほしい練習方法を入力してください。"></textarea>
      </div>

      <div style="display:flex; gap:12px; margin-top:24px;">

        <button type="submit" class="btn btn-primary">
          レッスンを作成
        </button>

        <a href="/pro/home" class="btn btn-secondary">
          ← プロホームへ戻る
        </a>

      </div>

    </form>

  </div>

</main>

</body>
</html>
