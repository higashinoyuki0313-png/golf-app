<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>レッスン詳細</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<main>

    <section class="page-heading lesson-detail-heading">
        <p class="page-label">LESSON DETAIL</p>

        <h1 th:text="${lesson.title}">
            レッスンタイトル
        </h1>

        <p class="lesson-pro">
            担当プロ：
            <span th:text="${lesson.proName}">プロ名</span>
        </p>
    </section>

    <section class="card lesson-detail-card">

        <div class="lesson-image-wrapper"
             th:if="${(lesson.image != null and lesson.image != '') or (lesson.video != null and lesson.video != '')}">

            <img th:if="${lesson.image != null and lesson.image != ''}"
                 th:src="${lesson.image}"
                 class="lesson-image"
                 alt="レッスン画像">

            <video th:if="${lesson.video != null and lesson.video != ''}"
                   controls
                   class="lesson-image">
                <source th:src="${lesson.video}">
                動画を再生できません。
            </video>

        </div>

        <div class="lesson-summary">

            <p class="lesson-content"
               th:text="${lesson.content}">
                レッスン内容
            </p>

            <div class="lesson-meta">

                <div class="lesson-meta-item">
                    <span class="lesson-meta-label">カテゴリ</span>
                    <span th:text="${lesson.category}">カテゴリ</span>
                </div>

                <div class="lesson-meta-item">
                    <span class="lesson-meta-label">申込者数</span>
                    <span>
                        <span th:text="${reservationCount}">0</span>名
                    </span>
                </div>

            </div>

        </div>

        <div class="lesson-section"
             th:if="${lesson.cause != null and lesson.cause != ''}">
            <h2>原因</h2>
            <p th:text="${lesson.cause}"></p>
        </div>

        <div class="lesson-section"
             th:if="${lesson.improvement != null and lesson.improvement != ''}">
            <h2>改善ポイント</h2>
            <p th:text="${lesson.improvement}"></p>
        </div>

        <div class="lesson-section"
             th:if="${lesson.practice != null and lesson.practice != ''}">
            <h2>おすすめ練習方法</h2>
            <p th:text="${lesson.practice}"></p>
        </div>

        <div class="page-actions">

            <form th:if="${loginAccount != null and loginAccount.role == 1}"
                  th:action="@{/lessons/{id}/apply(id=${lesson.id})}"
                  method="post">

                <button type="submit" class="btn btn-primary">
                    レッスン申込
                </button>

            </form>

            <a th:if="${loginAccount != null and loginAccount.role == 1}"
               th:href="@{/my-lessons}"
               class="btn btn-secondary">
                マイレッスンを見る
            </a>

            <a th:if="${loginAccount != null
        and loginAccount.role == 2
        and lesson.proId == loginAccount.id}"
               th:href="@{/lessons/{id}/edit(id=${lesson.id})}"
               class="btn btn-secondary">
                編集する
            </a>

            <form th:if="${loginAccount != null
        and loginAccount.role == 2
        and lesson.proId == loginAccount.id}"
                  th:action="@{/lessons/{id}/delete(id=${lesson.id})}"
                  method="post"
                  onsubmit="return confirm('本当に削除しますか？');">

                <button type="submit" class="btn btn-danger">
                    削除
                </button>
            </form>

            <a th:href="@{/lessons}"
               class="btn btn-secondary">
                ← 一覧へ戻る
            </a>

        </div>

    </section>

</main>

</body>
</html>
