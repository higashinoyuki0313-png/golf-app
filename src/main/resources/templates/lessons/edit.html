<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>レッスン編集</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main>

    <section class="hero">
        <p class="section-label">EDIT LESSON</p>
        <h2>レッスン編集</h2>
        <p>
            登録済みのレッスン内容を編集します。
        </p>
    </section>

    <div class="card auth-card">

        <form th:action="@{/lessons/{id}/edit(id=${lesson.id})}"
              method="post">

            <div>
                <label>カテゴリ</label><br>
                <select name="category" required>
                    <option value="slice" th:selected="${lesson.category == 'slice'}">スライス改善</option>
                    <option value="hook" th:selected="${lesson.category == 'hook'}">フック改善</option>
                    <option value="distance" th:selected="${lesson.category == 'distance'}">飛距離アップ</option>
                    <option value="contact" th:selected="${lesson.category == 'contact'}">ミート率アップ</option>
                    <option value="shortgame" th:selected="${lesson.category == 'shortgame'}">ショートゲーム</option>
                </select>
            </div>

            <div>
                <label>レッスンタイトル</label><br>
                <input type="text"
                       name="title"
                       th:value="${lesson.title}"
                       required>
            </div>

            <div>
                <label>画像URL</label><br>
                <input type="text"
                       name="image"
                       th:value="${lesson.image}">
            </div>

            <div>
                <label>レッスン内容</label><br>
                <textarea name="content"
                          rows="5"
                          required
                          th:text="${lesson.content}"></textarea>
            </div>

            <div>
                <label>原因</label><br>
                <textarea name="cause"
                          rows="4"
                          th:text="${lesson.cause}"></textarea>
            </div>

            <div>
                <label>改善ポイント</label><br>
                <textarea name="improvement"
                          rows="4"
                          th:text="${lesson.improvement}"></textarea>
            </div>

            <div>
                <label>おすすめ練習方法</label><br>
                <textarea name="practice"
                          rows="4"
                          th:text="${lesson.practice}"></textarea>
            </div>

            <div style="display:flex; gap:12px; margin-top:24px;">

                <button type="submit" class="btn btn-primary">
                    レッスンを更新
                </button>

                <a href="/lessons" class="btn btn-secondary">
                    ← レッスン一覧へ戻る
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
