<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ユーザー登録</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main>

  <div class="hero">
    <p class="section-label">REGISTER</p>
    <h2>新規ユーザー登録</h2>
    <p>アカウントを作成してレッスンを利用しましょう。</p>
  </div>

  <div class="card auth-card">

    <form th:action="@{/register}" method="post">

      <p class="error"
         th:if="${error}"
         th:text="${error}">
      </p>

      <div>
        <label>名前</label><br>
        <input
                type="text"
                name="name"
                th:value="${name}"
                required>
      </div>

      <div>
        <label>メールアドレス</label><br>
        <input
                type="email"
                name="email"
                th:value="${email}"
                required>
      </div>

      <div>
        <label>パスワード</label><br>
        <input
                type="password"
                name="password"
                required>
      </div>

      <br>

      <button
              type="submit"
              class="btn btn-primary">
        登録する
      </button>

    </form>

    <hr>

    <a
            th:href="@{/login}"
            class="btn btn-secondary">
      ログインへ戻る
    </a>

  </div>

</main>

</body>
</html>
