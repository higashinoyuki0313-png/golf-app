<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プロフィール編集</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <div class="card auth-card">

        <div class="error-message"
             th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/profile/edit}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">
                <label for="name">名前</label>
                <input id="name"
                       type="text"
                       name="name"
                       th:value="${account.name}"
                       required>
            </div>

            <div class="form-group">
                <label for="image">プロフィール画像</label>
                <input id="image"
                       type="file"
                       name="image"
                       accept="image/*">
            </div>

            <div class="form-group">
                <label for="profile">プロフィール</label>
                <textarea id="profile"
                          name="profile"
                          rows="5"
                          th:text="${account.profile}"></textarea>
            </div>

            <div class="form-group">
                <label for="favoriteClub">得意クラブ</label>

                <select id="favoriteClub"
                        name="favoriteClub">
                    <option value="">選択してください</option>
                    <option value="ドライバー"
                            th:selected="${account.favoriteClub == 'ドライバー'}">
                        ドライバー
                    </option>
                    <option value="フェアウェイウッド"
                            th:selected="${account.favoriteClub == 'フェアウェイウッド'}">
                        フェアウェイウッド
                    </option>
                    <option value="ユーティリティ"
                            th:selected="${account.favoriteClub == 'ユーティリティ'}">
                        ユーティリティ
                    </option>
                    <option value="アイアン"
                            th:selected="${account.favoriteClub == 'アイアン'}">
                        アイアン
                    </option>
                    <option value="ウェッジ"
                            th:selected="${account.favoriteClub == 'ウェッジ'}">
                        ウェッジ
                    </option>
                    <option value="パター"
                            th:selected="${account.favoriteClub == 'パター'}">
                        パター
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="bestScore">ベストスコア</label>
                <input id="bestScore"
                       type="number"
                       name="bestScore"
                       th:value="${account.bestScore}">
            </div>

            <div class="form-group">
                <label for="sns">SNS</label>

                <textarea
                        id="sns"
                        name="sns"
                        rows="4"
                        placeholder="Instagram：https://instagram.com/〇〇&#10;X：https://x.com/〇〇&#10;YouTube：https://youtube.com/@〇〇"
                        th:text="${account.sns}">
                </textarea>
            </div>


            <div class="profile-form-actions">
                <button type="submit" class="btn btn-primary">
                    保存する
                </button>

                <a href="/profile" class="btn btn-secondary">
                    戻る
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
