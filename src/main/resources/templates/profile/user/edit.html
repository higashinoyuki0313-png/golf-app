<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プロフィール編集</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="page-heading">
        <p class="page-label">MY ACCOUNT</p>
        <h1>プロフィール編集</h1>
        <p>プロフィール情報を編集できます。</p>
    </section>

    <div class="card auth-card">

        <div class="error-message"
             th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/profile/edit}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">
                <label for="name">名前</label>
                <input id="name"
                       type="text"
                       name="name"
                       th:value="${account.name}"
                       required>
            </div>

            <div class="form-group">
                <label for="image">プロフィール画像</label>
                <input id="image"
                       type="file"
                       name="image"
                       accept="image/*">

                <p class="form-help">
                    新しい画像を選択した場合のみ変更されます。
                </p>
            </div>

            <div class="form-group">
                <label for="profile">プロフィール</label>
                <textarea id="profile"
                          name="profile"
                          rows="5"
                          placeholder="自己紹介やゴルフ歴などを入力してください。"
                          th:text="${account.profile}"></textarea>
            </div>

            <div class="form-group">
                <label for="bestScore">ベストスコア</label>
                <input id="bestScore"
                       type="number"
                       name="bestScore"
                       min="0"
                       placeholder="例：85"
                       th:value="${account.bestScore}">
            </div>

            <div class="form-group">
                <label for="favoriteClub">得意クラブ</label>
                <select id="favoriteClub"
                        name="favoriteClub">
                    <option value="">選択してください</option>

                    <option value="ドライバー"
                            th:selected="${account.favoriteClub == 'ドライバー'}">
                        ドライバー
                    </option>

                    <option value="フェアウェイウッド"
                            th:selected="${account.favoriteClub == 'フェアウェイウッド'}">
                        フェアウェイウッド
                    </option>

                    <option value="ユーティリティ"
                            th:selected="${account.favoriteClub == 'ユーティリティ'}">
                        ユーティリティ
                    </option>

                    <option value="アイアン"
                            th:selected="${account.favoriteClub == 'アイアン'}">
                        アイアン
                    </option>

                    <option value="ウェッジ"
                            th:selected="${account.favoriteClub == 'ウェッジ'}">
                        ウェッジ
                    </option>

                    <option value="パター"
                            th:selected="${account.favoriteClub == 'パター'}">
                        パター
                    </option>
                </select>
            </div>

            <div class="profile-form-actions">
                <button type="submit" class="btn btn-primary">
                    保存する
                </button>

                <a th:href="@{/profile}"

                   class="btn btn-secondary">
                    戻る
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
