
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>投稿編集</title>
</head>
<body>

<h1>投稿編集</h1>

<form th:action="@{/posts/{id}/update(id=${post.id})}"
      method="post"
      enctype="multipart/form-data">
  <div>
    <label>タイトル</label><br>
    <input type="text" name="title" th:value="${post.title}">
  </div>

  <br>

  <div>
    <label>現在の画像</label><br>

    <img th:src="${post.image}"
         style="max-width:300px;">

    <br><br>

    <label>新しい画像（変更する場合のみ）</label><br>

    <input type="file" name="imageFile">
  </div>

  <br>

  <div>
    <label>内容</label><br>
    <textarea name="content" rows="5" cols="40" th:text="${post.content}"></textarea>
  </div>

  <div>
    <label>原因</label><br>
    <textarea
            name="cause"
            rows="5"
            cols="40"
            th:text="${post.cause}">
    </textarea>
  </div>

  <br>

  <div>
    <label>改善ポイント</label><br>
    <textarea
            name="improvement"
            rows="5"
            cols="40"
            th:text="${post.improvement}">
    </textarea>
  </div>

  <br>

  <div>
    <label>おすすめ練習方法</label><br>
    <textarea
            name="practice"
            rows="5"
            cols="40"
            th:text="${post.practice}">
    </textarea>
  </div>

  <br>

  <div>
    <label>カテゴリ</label><br>

    <select name="category">
      <option value="slice"
              th:selected="${post.category == 'slice'}">
        スライス改善
      </option>

      <option value="hook"
              th:selected="${post.category == 'hook'}">
        フック改善
      </option>

      <option value="distance"
              th:selected="${post.category == 'distance'}">
        飛距離アップ
      </option>

      <option value="contact"
              th:selected="${post.category == 'contact'}">
        ミート率アップ
      </option>

      <option value="shortgame"
              th:selected="${post.category == 'shortgame'}">
        ショートゲーム
      </option>
    </select>
  </div>

  <br>

  <button type="submit">更新する</button>
</form>

</body>
</html>
