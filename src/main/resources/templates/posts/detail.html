<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>投稿詳細</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f8f4;
      margin: 0;
      padding: 40px;
      color: #1f2d1f;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .detail-card {
      background-color: white;
      border: 1px solid #d6e6d6;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .header {
      background-color: #087a2d;
      color: white;
      padding: 20px 28px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .content {
      padding: 28px;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .info-box {
      border: 1px solid #d6e6d6;
      border-radius: 14px;
      padding: 20px;
      background-color: #ffffff;
    }

    .info-box h2 {
      color: #087a2d;
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 12px;
    }

    .info-box ul {
      margin: 0;
      padding-left: 20px;
      line-height: 1.9;
    }

    .advice-box {
      background-color: #f0faf0;
      border: 1px solid #b8ddb8;
      border-radius: 14px;
      padding: 20px;
      margin-top: 24px;
    }

    .advice-box h2 {
      color: #087a2d;
      margin-top: 0;
    }

    .action-area {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      align-items: center;
    }

    .back-link,
    .edit-link {
      display: inline-block;
      color: #087a2d;
      text-decoration: none;
      font-weight: bold;
    }

    .delete-button {
      background-color: #d93025;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .section-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="detail-card">
    <div class="header">
      <h1 th:text="${post.title}"></h1>
      <a th:href="@{/accounts/{id}(id=${pro.id})}"
         th:text="${pro.name}">
      </a>
    </div>

    <div class="content">
      <div class="section-grid">
        <div class="info-box">
          <h2>原因</h2>
          <ul>
            <li th:text="${post.cause}"></li>
          </ul>
        </div>

        <div class="info-box">
          <h2>改善ポイント</h2>
          <ul>
            <li th:text="${post.improvement}"></li>
          </ul>
        </div>

        <div class="info-box">
          <h2>おすすめ練習方法</h2>
          <ul>
            <li th:text="${post.practice}"></li>
          </ul>
        </div>

        <div class="info-box">
          <h2>おすすめ動画</h2>
          <img th:if="${post.image != null}"
               th:src="${post.image}"
               style="max-width: 100%; border-radius: 12px;">
        </div>
      </div>

      <div class="advice-box">
        <h2>ワンポイントアドバイス</h2>
        <p>焦らず一つずつ改善していくことで、スイングは安定していきます。</p>
      </div>

      <div class="advice-box">
        <h2>関連レッスン</h2>

        <ul>
          <li th:each="lesson : ${lessons}">

            <a th:href="@{/lessons/{id}(id=${lesson.id})}"
               th:text="${lesson.title}">
            </a>

            <form th:action="@{/lessons/{id}/reserve(id=${lesson.id})}"
                  method="post">

              <button type="submit">
                このレッスンを申し込む
              </button>
            </form>
          </li>
        </ul>
      </div>

      <div class="action-area">
       <a class="edit-link"
          th:href="@{/posts/{id}/edit(id=${post.id})}"
          th:if="${loginAccount != null and post.proId == loginAccount.id}">
         編集する
       </a>

        <form th:action="@{/posts/{id}/delete(id=${post.id})}"
              method="post"
              th:if="${loginAccount != null and post.proId == loginAccount.id}">
          <button class="delete-button" type="submit">
            削除
          </button>
        </form>

        <a class="back-link" href="/posts">
          ← 一覧へ戻る
        </a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
