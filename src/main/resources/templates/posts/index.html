<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>投稿一覧</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f8f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 40px;
            text-align: center;
            color: #087a2d;
            margin-bottom: 10px;
        }

        .page-description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .post-count {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .no-post-message {
            background-color: #e8f5e9;
            border: 1px solid #087a2d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            color: #087a2d;
            font-weight: bold;
        }

        .new-post-btn {
            display: inline-block;
            background-color: #087a2d;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .post-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .post-card {
            background-color: white;
            border: 1px solid #d6e6d6;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .post-card:hover {
            border-color: #087a2d;
        }

        .post-tag {
            display: inline-block;
            background-color: #e8f4ff;
            color: #087a2d;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .post-title {
            color: #087a2d;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .post-content {
            color: #555;
            line-height: 1.7;
        }

        .detail-link {
            display: inline-block;
            margin-top: 16px;
            color: #087a2d;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .post-list {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>

<div class="container">

    <h1 class="page-title">
        ゴルフスイング改善アプリ
    </h1>

    <p class="page-description">
        あなたの悩みを選んで、最適な改善方法を見つけましょう
    </p>

    <p class="post-count">
        現在 <span th:text="${postCount}"></span> 件の投稿があります
    </p>

    <a th:if="${loginAccount != null and loginAccount.role == 2}"
       href="/posts/new"
       class="new-post-btn">
        ＋ 新規投稿
    </a>

    <div class="no-post-message" th:if="${postCount == 0}">
        投稿がありません。<br>
        新規投稿から作成して下さい。
    </div>

    <div class="post-list">

        <div class="post-card" th:each="post : ${posts}">

            <div class="post-tag">
                お悩み
            </div>

            <h2 class="post-title"
                th:text="${post.title}">
            </h2>

            <p class="post-content"
               th:text="${post.content}">
            </p>

            <a class="detail-link"
               th:href="@{/posts/{id}(id=${post.id})}">
                改善方法を見る →
            </a>

        </div>

    </div>

    <div style="margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap;">

        <a th:if="${loginAccount != null and loginAccount.role == 2}"
           href="/pro/home"
           class="new-post-btn">
            ← プロホームへ戻る
        </a>

        <a th:if="${loginAccount != null and loginAccount.role == 1}"
           href="/user/home"
           class="new-post-btn">
            ← ホームへ戻る
        </a>

    </div>

    <br>

    <a href="/logout">
        ログアウト
    </a>

</div>

</body>
</html>
