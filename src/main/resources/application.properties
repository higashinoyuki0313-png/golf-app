spring.application.name=golf-app

cloudinary.cloud-name=dorhdiiij
cloudinary.api-key=578524292664995
cloudinary.api-secret=qzqoM9MFbYs4UmvrJRESqAYJnDw
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.datasource.url=jdbc:postgresql://localhost:5433/myproject
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway（マイグレーション管理）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# 適用済みマイグレーション(V1/V2)を後から書き換えたことによる
# チェックサム不一致を起動時に repair して復旧する（FlywayConfig 参照）。
# 移行が落ち着いたら false にしてよい。
app.flyway.repair-before-migrate=true

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/*.xml

server.error.include-message=always
server.error.include-stacktrace=always

logging.level.org.springframework=INFO
logging.level.com.golf.app.golfapp=DEBUG