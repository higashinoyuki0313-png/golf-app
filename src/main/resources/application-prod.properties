# 本番（Docker / Elastic Beanstalk）用設定
# 接続情報は docker-compose の環境変数から渡す（デフォルトはEB構成に合わせる）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/golf}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 本番ではエラー詳細を画面に出さない
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.org.springframework=INFO
logging.level.com.golf.app.golfapp=INFO
