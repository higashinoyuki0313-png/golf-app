<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ホーム</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main>

    <div class="hero">
        <p class="section-label">ADMIN</p>
        <h2>管理者ホーム</h2>
        <p>登録されているアカウントを管理できます。</p>
    </div>

    <div class="card">

        <table class="table">

            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>メールアドレス</th>
                <th>権限</th>
                <th>操作</th>
            </tr>

            <tr th:each="account : ${accounts}">

                <td th:text="${account.id}"></td>

                <td th:text="${account.name}"></td>

                <td th:text="${account.email}"></td>

                <td>
                    <span th:if="${account.role == 1}">
                        ユーザー
                    </span>

                    <span th:if="${account.role == 2}">
                        プロ
                    </span>

                    <span th:if="${account.role == 9}">
                        管理者
                    </span>
                </td>

                <td>

                    <form th:if="${account.role != 9}"
                          th:action="@{/admin/accounts/{id}/delete(id=${account.id})}"
                          method="post">

                        <button type="submit" class="btn btn-danger">
                            削除
                        </button>

                    </form>

                </td>

            </tr>

        </table>

        <br>

        <a href="/logout" class="btn btn-secondary">
            ログアウト
        </a>

    </div>

</main>

</body>
</html>
